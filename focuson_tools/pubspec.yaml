publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.5.4

dependencies:
  flutter:
    sdk: flutter
  intl: ^0.19.0
  crypto: ^3.0.3
  focuson_core:
    path: ../../packages/focuson_core
  focuson_models:
    path: ../../packages/focuson_models
  focuson_database:
    path: ../../packages/focuson_database
  focuson_design_system:
    path: ../../packages/focuson_design_system
  focuson_interop:
    path: ../../packages/focuson_interop

dev_dependencies:
